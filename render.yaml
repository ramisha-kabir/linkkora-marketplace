databases:
  - name: linkkora-db
    databaseName: linkkora
    user: linkkora_user

services:
  - type: web
    name: linkkora-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT flask_app_postgres:app
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkkora-db
          property: connectionString

  - type: static
    name: linkkora-frontend
    buildCommand: cd linkkora-frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: linkkora-frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: linkkora-backend
          type: web
          property: url

